
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova transação | FinanceAPI</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 30px 16px;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 28px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.07);
        }

        h1 { margin-top: 0; font-size: 26px; }

        .subtitle { color: #6b7280; margin-bottom: 24px; }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        .warning, .message {
            display: none;
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .warning {
            color: #92400e;
            background: #fef3c7;
            border: 1px solid #fcd34d;
        }

        .success {
            color: #166534;
            background: #dcfce7;
            border: 1px solid #86efac;
        }

        .error {
            color: #991b1b;
            background: #fee2e2;
            border: 1px solid #fca5a5;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled { opacity: 0.6; cursor: wait; }

        .note {
            margin-top: 18px;
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Nova transação</h1>
        <p class="subtitle">Registre suas receitas e despesas.</p>

        <form id="transaction-form">
            {% csrf_token %}

            <label for="description">Descrição</label>
            <input type="text" id="description" name="description"
                   placeholder="Ex.: Conta de energia" required>

            <label for="amount">Valor (R$)</label>
            <input type="number" id="amount" name="amount"
                   min="0.01" step="0.01" placeholder="Ex.: 150.00" required>

            <label for="transaction_type">Tipo de transação</label>
            <select id="transaction_type" name="transaction_type" required>
                <option value="INCOME">Receita</option>
                <option value="EXPENSE" selected>Despesa</option>
            </select>

            <label for="category">Categoria</label>
            <input type="text" id="category" name="category"
                   placeholder="Ex.: Alimentação" required>

            <label for="date">Data da transação</label>
            <input type="date" id="date" name="date" required>

            <div id="future-date-warning" class="warning" role="alert">
                <strong>Atenção!</strong>
                Você selecionou uma data futura. Confira a data antes de
                continuar. O cadastro continuará permitido.
            </div>

            <div id="message" class="message" role="status"
                 aria-live="polite"></div>

            <button id="submit-button" type="submit">
                Cadastrar transação
            </button>

            <p class="note">
                Datas futuras são permitidas. O aviso serve para confirmar
                que você escolheu a data correta.
            </p>
        </form>
    </main>

    <script>
        const form = document.getElementById("transaction-form");
        const dateInput = document.getElementById("date");
        const warning = document.getElementById("future-date-warning");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submit-button");

        function getLocalToday() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function checkFutureDate() {
            warning.style.display =
                dateInput.value && dateInput.value > getLocalToday()
                    ? "block"
                    : "none";
        }

        dateInput.addEventListener("input", checkFutureDate);
        dateInput.addEventListener("change", checkFutureDate);

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            message.style.display = "none";
            message.textContent = "";
            message.className = "message";

            const data = {
                description: document.getElementById("description").value.trim(),
                amount: document.getElementById("amount").value,
                transaction_type: document.getElementById("transaction_type").value,
                category: document.getElementById("category").value.trim(),
                date: dateInput.value
            };

            const csrfToken = form.querySelector(
                "[name=csrfmiddlewaretoken]"
            ).value;

            submitButton.disabled = true;
            submitButton.textContent = "Cadastrando...";

            try {
                const response = await fetch("/api/transactions/", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrfToken
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    const errors = Object.entries(result)
                        .map(([field, details]) => {
                            const text = Array.isArray(details)
                                ? details.join(" ")
                                : JSON.stringify(details);
                            return `${field}: ${text}`;
                        })
                        .join(" | ");

                    throw new Error(
                        errors || `Erro HTTP ${response.status}`
                    );
                }

                message.className = "message success";
                message.textContent =
                    `Transação cadastrada com sucesso! ID: ${result.id}.`;
                message.style.display = "block";

                form.reset();
                warning.style.display = "none";
            } catch (error) {
                message.className = "message error";
                message.textContent =
                    "Não foi possível cadastrar: " + error.message;
                message.style.display = "block";
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Cadastrar transação";
            }
        });
    </script>
</body>
</html>
