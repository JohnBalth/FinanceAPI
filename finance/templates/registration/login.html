
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FinanceAPI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f8fe;
            font-family: Arial, sans-serif;
            color: #1f2937;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(37, 131, 233, 0.12);
        }

        h1 {
            margin-top: 0;
            color: #2583e9;
            text-align: center;
        }

        p {
            text-align: center;
            color: #64748b;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 24px;
            border: none;
            border-radius: 8px;
            background: #2583e9;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1765c0;
        }

        .error {
            color: #d64b5d;
            text-align: left;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1>FinanceAPI</h1>
        <p>Entre na sua conta para continuar.</p>

        <form method="post">
            {% csrf_token %}

            {% if form.errors %}
                <p class="error">
                    Usuário ou senha inválidos. Tente novamente.
                </p>
            {% endif %}

            <label for="id_username">Nome de usuário</label>
            <input
                type="text"
                name="username"
                id="id_username"
                autocomplete="username"
                required
            >

            <label for="id_password">Senha</label>
            <input
                type="password"
                name="password"
                id="id_password"
                autocomplete="current-password"
                required
            >

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit">Entrar</button>
        </form>
    </main>
</body>
</html>
