 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro recebido | FinanceAPI</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f3f8fe;
            color: #1f2937;
        }

        .card {
            width: 100%;
            max-width: 460px;
            padding: 36px;
            text-align: center;
            background: #fff;
            border: 1px solid #e1eaf5;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(37, 131, 233, 0.10);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 14px;
            color: #172b4d;
            font-size: 26px;
        }

        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.7;
        }

        .status {
            margin: 22px 0;
            padding: 14px;
            border-radius: 10px;
            background: #fff7e6;
            color: #8a5a00;
            font-weight: bold;
        }

        a {
            display: inline-block;
            margin-top: 12px;
            color: #1765c0;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon">⏳</div>

        <h1>Cadastro recebido!</h1>

        <p>
            Olá, {{ username }}! Sua conta na FinanceAPI foi criada.
        </p>

        <div class="status">
            Aguardando aprovação do administrador
        </div>

        <p>
            Você poderá entrar depois que o administrador liberar seu acesso.
            Aguarde a confirmação antes de tentar fazer login.
        </p>

        <a href="{% url 'login' %}">Voltar para o login</a>
    </main>
</body>
</html>
