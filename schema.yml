openapi: 3.0.3
info:
  title: FinanceAPI
  version: 1.0.0
  description: API para gerenciamento de receitas e despesas pessoais.
paths:
  /api/transactions/:
    get:
      operationId: transactions_list
      description: Retorna as transações do usuário autenticado. Cada usuário acessa
        somente suas próprias transações.
      summary: Listar transações
      tags:
      - Transações
      security:
      - cookieAuth: []
      - basicAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
          description: ''
    post:
      operationId: transactions_create
      description: Cadastra uma nova receita ou despesa para o usuário autenticado.
        O usuário é definido automaticamente.
      summary: Criar transação
      tags:
      - Transações
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Transaction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Transaction'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
  /api/transactions/{id}/:
    get:
      operationId: transactions_retrieve
      description: Retorna os detalhes de uma transação pertencente ao usuário autenticado.
      summary: Consultar transação
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Transações
      security:
      - cookieAuth: []
      - basicAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
    put:
      operationId: transactions_update
      description: Atualiza os campos de uma transação existente. Envie os campos
        exigidos pelo serializer.
      summary: Atualizar transação
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Transações
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Transaction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Transaction'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
    patch:
      operationId: transactions_partial_update
      description: Permite atualizar somente alguns campos de uma transação existente.
      summary: Atualizar parcialmente uma transação
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Transações
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTransaction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTransaction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTransaction'
      security:
      - cookieAuth: []
      - basicAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
    delete:
      operationId: transactions_destroy
      description: Exclui uma transação pertencente ao usuário autenticado. A operação
        não pode ser desfeita.
      summary: Excluir transação
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Transações
      security:
      - cookieAuth: []
      - basicAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    PatchedTransaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        description:
          type: string
          title: Descrição
          maxLength: 200
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          title: Valor
        transaction_type:
          allOf:
          - $ref: '#/components/schemas/TransactionTypeEnum'
          title: Tipo
        category:
          type: string
          title: Categoria
          maxLength: 100
        date:
          type: string
          format: date
          title: Data da transação
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criada em
        user:
          type: integer
          readOnly: true
    Transaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        description:
          type: string
          title: Descrição
          maxLength: 200
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          title: Valor
        transaction_type:
          allOf:
          - $ref: '#/components/schemas/TransactionTypeEnum'
          title: Tipo
        category:
          type: string
          title: Categoria
          maxLength: 100
        date:
          type: string
          format: date
          title: Data da transação
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criada em
        user:
          type: integer
          readOnly: true
      required:
      - amount
      - category
      - created_at
      - date
      - description
      - id
      - transaction_type
      - user
    TransactionTypeEnum:
      enum:
      - INCOME
      - EXPENSE
      type: string
      description: |-
        * `INCOME` - Receita
        * `EXPENSE` - Despesa
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
